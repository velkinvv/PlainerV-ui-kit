name: Sync GitHub Docs

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Фильтр платформы (web|mobile), опционально"
        required: false
        default: ""
        type: string
      version:
        description: "Фильтр версии (например v_0.1.0), опционально"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefix web --workspaces=false

      - name: Sync docs from GitHub branches
        run: |
          set -e
          SYNC_ARGUMENTS=""
          if [ -n "${{ inputs.platform }}" ]; then
            SYNC_ARGUMENTS="$SYNC_ARGUMENTS --platform ${{ inputs.platform }}"
          fi
          if [ -n "${{ inputs.version }}" ]; then
            SYNC_ARGUMENTS="$SYNC_ARGUMENTS --version ${{ inputs.version }}"
          fi
          npm run --prefix web docs:sync:github-docs -- $SYNC_ARGUMENTS

      - name: Check for documentation changes
        id: documentation_changes
        run: |
          set -e
          if [ -n "$(git status --porcelain -- web/docs-app/content/docs)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Найдены изменения в web/docs-app/content/docs"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Изменений в web/docs-app/content/docs нет, PR не требуется"
          fi

      - name: Create Pull Request
        if: steps.documentation_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Обновил документацию из GitHub веток"
          title: "Обновил документацию из GitHub веток"
          body: |
            Этот PR создан автоматически после синхронизации документации из веток GitHub-репозиториев.
          branch: "chore/sync-github-docs"
          base: "main"
          delete-branch: true
          add-paths: |
            web/docs-app/content/docs/**
