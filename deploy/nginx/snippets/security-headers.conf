# Заголовки безопасности для документации.
#
# nginx не наследует add_header в location, где объявлен собственный add_header,
# поэтому файл подключается и в server{}, и в каждый location с кэш-заголовками.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CORP намеренно не выставляем: с same-origin браузер не покажет og:image
# при встраивании превью на сторонних сайтах, а cross-origin эту директиву
# обесценивает. От фрейминга закрывает X-Frame-Options выше.

# HSTS без includeSubDomains: поддомены могут хоститься отдельно.
add_header Strict-Transport-Security "max-age=31536000" always;

# 'unsafe-eval' нужен Playground: react-live исполняет примеры через new Function.
# 'wasm-unsafe-eval' — индекс Pagefind работает на WebAssembly.
# 'unsafe-inline' в style-src — styled-components вставляет <style> в документ.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
