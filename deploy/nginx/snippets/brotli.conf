# Brotli-сжатие. Подключать только если nginx собран с модулем ngx_brotli:
#   nginx -V 2>&1 | grep -q brotli
# Иначе nginx -t упадёт с «unknown directive "brotli"».
#
# Предварительно сжатых *.br файлов сборка не создаёт, поэтому brotli_static
# выключен: он бесполезен без файлов и только добавляет проверку на диск.

brotli            on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    application/wasm;
