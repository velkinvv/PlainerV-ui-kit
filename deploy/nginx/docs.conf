# Конфигурация nginx для документации PlainerV.
#
# Раскладку на сервере создаёт web/scripts/deploy-docs.sh:
#   __DOCS_ROOT__/releases/<версия>-<sha>/docs/   статика одного релиза (содержимое docs-app/dist)
#   __DOCS_ROOT__/current -> releases/<версия>-<sha>
#
# Публичные адреса живут под /docs/ (в docs-app задан base = '/docs/'), поэтому
# DOCS_SITE_URL — это домен без префикса (https://docs.example.com), а /docs
# к canonical, hreflang, sitemap и og:image добавляет prerender.
#
# Файл — шаблон. Перед nginx -t подставьте значения, например:
#   sed -e 's|__DOCS_DOMAIN__|docs.example.com|g' \
#       -e 's|__DOCS_ROOT__|/var/www/plainerv-docs|g' \
#       -e 's|__DOCS_TLS_CERT__|/etc/letsencrypt/live/docs.example.com/fullchain.pem|g' \
#       -e 's|__DOCS_TLS_KEY__|/etc/letsencrypt/live/docs.example.com/privkey.pem|g' \
#       docs.conf > /etc/nginx/sites-available/plainerv-docs.conf
#
# Сниппеты ожидаются в /etc/nginx/snippets/ (include разрешается относительно
# префикса nginx, а не относительно этого файла).

server {
    listen      80;
    listen [::]:80;
    server_name __DOCS_DOMAIN__;

    # Продление сертификата без остановки сайта.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Параметр http2 в listen работает на всех версиях, но с nginx 1.25.1+
    # помечен deprecated. На новом nginx замените на:
    #   listen 443 ssl;  listen [::]:443 ssl;  http2 on;
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOCS_DOMAIN__;

    ssl_certificate     __DOCS_TLS_CERT__;
    ssl_certificate_key __DOCS_TLS_KEY__;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:docs_tls:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  __DOCS_ROOT__/current;
    index index.html;

    charset          utf-8;
    server_tokens    off;
    # Редиректы отдаём относительными: за TLS-терминатором nginx иначе
    # подставит http:// в Location.
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_static       on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        application/wasm;

    # Brotli есть только в сборках с ngx_brotli (nginx -V | grep -q brotli).
    # Без модуля директива brotli ломает nginx -t, поэтому include закомментирован.
    # include snippets/brotli.conf;

    # Общие заголовки для location без собственного add_header.
    include snippets/security-headers.conf;

    # Страница «не найдено» лежит внутри релиза (docs/404.html).
    error_page 404 /404.html;

    location = /404.html {
        internal;
        root __DOCS_ROOT__/current/docs;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Корень домена отдаём документации.
    location = / {
        return 302 /docs/;
    }

    # /docs без завершающего слэша: префиксный location /docs/ такой URI
    # не матчит, и запрос уходил бы в location / с ответом 404.
    location = /docs {
        return 301 /docs/;
    }

    # robots.txt, sitemap.xml и llms*.txt роботы и агенты запрашивают в корне
    # домена, а лежат файлы внутри релиза (current/docs/...). Домен целиком
    # занят документацией; на общем домене этот блок нужно убрать.
    location ~ ^/(robots\.txt|sitemap\.xml|llms(-full)?\.txt)$ {
        root __DOCS_ROOT__/current/docs;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;

        access_log off;
    }

    # Ассеты Vite содержат хэш в имени — их можно кэшировать навсегда.
    # location с собственным add_header не наследует add_header из server,
    # поэтому сниппет с заголовками безопасности подключается повторно.
    location /docs/assets/ {
        try_files $uri =404;

        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
    }

    # Индекс поиска Pagefind: pagefind-entry.json, *.pf_fragment, *.pf_index.
    # Имена файлов не содержат хэша, поэтому кэш отключён: иначе после деплоя
    # браузер возьмёт старый pagefind-entry.json и запросит фрагменты,
    # которых в новом релизе уже нет, — поиск молча перестанет находить страницы.
    location /docs/pagefind/ {
        try_files $uri =404;

        # У фрагментов индекса расширения .pf_* неизвестны mime.types;
        # без явного типа nginx отдал бы их как text/plain.
        default_type application/octet-stream;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;

        access_log off;
    }

    # OG-картинки: имена стабильные, содержимое зависит от релиза.
    location /docs/og/ {
        try_files $uri =404;

        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;

        access_log off;
    }

    # Пререндеренные страницы: /docs/<локаль>/<платформа>/<версия>/...
    # $uri.html — на случай прямого запроса файла без каталога.
    # Последний аргумент =404 (а не /404.html), чтобы несуществующая страница
    # отдавалась с кодом 404, а не 200: HTML подставляется через error_page.
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;

        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Всё остальное на домене не наше.
    location / {
        return 404;
    }
}
